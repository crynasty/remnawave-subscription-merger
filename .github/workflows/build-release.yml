name: Build Release Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 3.1.3)
        required: true
        type: string
      commit:
        description: Full commit SHA to build
        required: true
        type: string

env:
  IMAGE_BASE: ghcr.io/crynasty/remnawave-subscription-merger

jobs:
  build-release:
    name: Build and Push Release Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ -z "${VERSION}" ]]; then
            echo "Version must not be empty" >&2
            exit 1
          fi

          MAJOR_VERSION="${VERSION%%.*}"
          if [[ -z "${MAJOR_VERSION}" ]]; then
            echo "Failed to derive major version from '${VERSION}'" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BASE }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE_BASE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.commit.outputs.short }}
